# OpenVPN server for MikroTik management tunnels.
#
# RouterOS 6 has no WireGuard, so this is the path for older routers. RouterOS's
# OpenVPN client is TCP-only and does not support LZO or auth-less UDP, hence the
# settings below — they are dictated by the client, not by preference.

dev tun
proto tcp-server          # RouterOS 6 cannot do OpenVPN over UDP
port 1194
topology subnet

# The whole tunnel supernet. Each tenant owns a /24 inside it (tenants.tunnel_subnet)
# and client-connect.sh pins each router to its allocated address.
server 10.50.0.0 255.255.0.0

# Routers authenticate with the username/password the app minted; no client certs.
verify-client-cert none
username-as-common-name
auth-user-pass-verify /etc/openvpn/auth.sh via-file
script-security 3

# Hand each router the exact address recorded in ovpn_clients.
client-connect /etc/openvpn/client-connect.sh

ca   /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/server.crt
key  /etc/openvpn/pki/server.key
dh   /etc/openvpn/pki/dh.pem

# OpenVPN 2.6 negotiates the data cipher from `data-ciphers`, which defaults to
# GCM only. RouterOS 6 offers nothing but AES-256-CBC, so without these two lines
# a router authenticates fine and is then dropped with "no shared cipher".
data-ciphers          AES-256-CBC
data-ciphers-fallback AES-256-CBC   # for clients too old to negotiate at all

# The HMAC digest. Unlike the cipher this is NOT negotiated, so it has to match
# the router exactly. SHA1 because the RouterOS 6 OVPN client rejects sha256 on
# the auth= parameter — the command will not even parse. HMAC-SHA1 remains sound;
# the SHA1 collision work does not translate into an attack on HMAC.
# Override with OVPN_AUTH_DIGEST if your whole fleet is RouterOS 7.
auth SHA1
persist-key
persist-tun
keepalive 10 60

# This is a management tunnel. Routers must NOT send customer traffic through it,
# so no redirect-gateway and no pushed routes beyond the server itself.

status /tmp/openvpn-status.log 10
verb 3
