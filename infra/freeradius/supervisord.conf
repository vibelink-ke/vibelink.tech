# Two sibling processes in this one container: radiusd itself, and the
# radacct/radpostauth purge loop (radacct-purge.sh) — kept apart from radiusd
# so a crash in one restarts just that one, not the whole container, and
# gives the purge loop a place to live without a second container.
#
# RADIUSD_BIN is set by entrypoint.sh, which already resolved the real path
# (/opt/sbin vs /usr/sbin — see its own comment on why that varies).
[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

# Passing -c on the command line (see entrypoint.sh) means supervisord never
# reads Alpine's own /etc/supervisord.conf, which is where these three
# sections normally live — without them supervisord runs the programs below
# fine, but exposes no control socket at all, and `supervisorctl status`
# fails with "no such file" against the socket path it assumes by default.
[unix_http_server]
file=/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:radiusd]
command=%(ENV_RADIUSD_BIN)s -f
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:radacct-purge]
command=/bin/sh /config/radacct-purge.sh
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
