# Production stack for a single VPS.
#
#   cp .env.production.example .env   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml, which is a laptop convenience:
#   - Postgres publishes no port. It is reachable only on the compose network.
#   - Everything is on by default; there is no `network` profile to remember.
#   - Caddy terminates TLS and is the only thing listening on 80/443.
#   - FreeRADIUS runs without -X, which logs full credentials.
services:
  # Owns the network namespace that openvpn, api and freeradius all share. It does
  # nothing but exist.
  #
  # The tunnel only exists inside one namespace, and the API has to reach routers
  # through it while FreeRADIUS has to answer on its address. Making openvpn the
  # owner worked until openvpn was rebuilt: recreating it destroys the namespace,
  # leaving the other two attached to nothing and Caddy returning 502 until every
  # one of them was restarted in the right order. A container that never changes
  # holds it instead, so any of the three can be rebuilt on its own.
  net:
    image: alpine:3.20
    container_name: billing-net
    restart: unless-stopped
    command: ['sleep', 'infinity']
    # ip_forward belongs to the namespace, so it has to be set by whoever owns it.
    sysctls:
      - net.ipv4.ip_forward=1
    # Every port for all four services is published here.
    ports:
      - '1194:1194/tcp'   # OVPN. TCP, not UDP: the RouterOS 6 client cannot do UDP
      - '1812:1812/udp'   # RADIUS authentication
      - '1813:1813/udp'   # RADIUS accounting
      # 8080 stays unpublished; Caddy reaches the API inside the network as net:8080.

  db:
    image: postgres:16-alpine
    container_name: billing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No `ports`. Publishing 5432 on a public VPS is how databases get found.
    volumes:
      - billing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # In the shared namespace, which is the only place the tunnel exists. Without it
  # the API has no route to 10.50.0.0/16 and every CoA goes into a void — the
  # database stays correct, so the only symptom is speed changes never arriving.
  api:
    build: ./backend
    container_name: billing-api
    restart: unless-stopped
    network_mode: 'service:net'
    depends_on:
      db:
        condition: service_healthy
      net:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: '8080'
      # Daraja and KopoKopo POST payment confirmations here. If this is wrong the
      # STK prompt still reaches the handset and the payment never completes.
      BASE_URL: https://${ROOT_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      RADIUS_COA_PORT: ${RADIUS_COA_PORT:-3799}
      # Encrypts the per-router service passwords. Without it, pushing router
      # configuration refuses rather than storing them in the clear.
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      # Daraja does not sign its own webhook callbacks; this secret (appended
      # as ?k=... to the callback URLs) is what stops a forged "payment
      # succeeded" POST from crediting an account for free. Unset = the
      # webhook rejects everything rather than accepting unsigned requests.
      DARAJA_WEBHOOK_SECRET: ${DARAJA_WEBHOOK_SECRET}
      # Same role for KopoKopo's X-KopoKopo-Signature HMAC.
      KOPOKOPO_WEBHOOK_SECRET: ${KOPOKOPO_WEBHOOK_SECRET}
      # Same role again for Equity/Co-op/KCB's bank STK callbacks — none of
      # them sign their webhooks either.
      BANKSTK_WEBHOOK_SECRET: ${BANKSTK_WEBHOOK_SECRET:-}
      # Nightly pg_dump destination (backend/src/backup.js). Unset = the job
      # logs a warning and skips rather than failing.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-vibelink-db-backups}
      # WireGuard onboarding. Optional: without them the button says what to set
      # rather than minting a peer that could never hand shake. The endpoint is
      # where routers dial, and the public key is the server's own — the private
      # key stays in the wireguard container and never reaches the API.
      WG_ENDPOINT: ${WG_ENDPOINT:-}
      WG_SERVER_PUBLIC_KEY: ${WG_SERVER_PUBLIC_KEY:-}
      # Deliberately unset: DEV_TENANT would let any unresolved hostname fall
      # through to one tenant's data.
    volumes:
      # Read-only: the API only needs to see which tunnels are up and on what
      # address. Anything that can write here could redirect a router.
      - ovpn-run:/run/openvpn:ro
      # The WireGuard server config, which is rendered from wg_peers by
      # scripts/wg-sync.mjs. It has to be mounted here rather than only on the
      # wireguard container: the database lives on this side, the file is read
      # on that side, and until both met in one place the documented setup
      # could not be run at all. Writable, because writing it is the point.
      - ./infra/wireguard/wg_confs:/config/wg_confs
      # Read-only, and only ca.crt is ever actually read from it (see
      # server.js's staff VPN peer route) — ca.key lives in this same
      # directory but the API has no reason to open it and never does.
      # Mounted as a directory rather than a single file: pinning one file
      # out of a named volume needs Compose's `subpath:` (recent versions
      # only), and the whole-directory mount works everywhere.
      - billing-ovpn-pki:/etc/openvpn/pki:ro
    # No `ports`: the namespace belongs to `net`. Caddy reaches it as net:8080.
    # localhost works here specifically because api shares net's own network
    # namespace (network_mode above) — from any other container this would
    # need to be net:8080 instead.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    container_name: billing-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'     # required: Let's Encrypt HTTP-01 validation
      - '443:443'
    volumes:
      - caddy-data:/data      # certificates; losing this re-issues them
      - caddy-config:/config
    # No healthcheck here on purpose: on-demand TLS means even a request
    # this container can answer correctly may still round-trip Let's
    # Encrypt on a cold cache, and neither the official Caddy image nor
    # Alpine's own base is guaranteed to carry wget/curl/nc to probe with
    # regardless — a check likely to false-negative is worse than none, on
    # the one container that terminates TLS for every tenant.

  # Also in the shared namespace. Routers send RADIUS to 10.50.0.1, the tunnel-side
  # address of that namespace — from anywhere else those packets arrive at the
  # OpenVPN process and are dropped.
  freeradius:
    build: ./infra/freeradius
    container_name: billing-radius
    restart: unless-stopped
    network_mode: 'service:net'
    depends_on:
      db:
        condition: service_healthy
      net:
        condition: service_started
    environment:
      TZ: ${TZ:-Africa/Nairobi}
      PGHOST: db
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    # Ports live on `net`.
    volumes:
      - ./infra/freeradius:/config:ro
    entrypoint: ['/bin/sh', '/config/entrypoint.sh']
    # Not -X. Debug mode prints every credential it handles.
    command: ['radiusd', '-f']

  openvpn:
    build: ./infra/openvpn
    container_name: billing-ovpn
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      net:
        condition: service_started
    network_mode: 'service:net'
    # Capabilities and devices are per-container even when the namespace is shared,
    # so these stay here rather than moving to `net`.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    # Ports are published on `net`, which owns the namespace.
    volumes:
      - billing-ovpn-pki:/etc/openvpn/pki
      # Writer side of the status file the API reads to learn which routers are
      # actually connected, and on which tunnel address.
      - ovpn-run:/run/openvpn

  wireguard:
    image: linuxserver/wireguard:latest
    container_name: billing-wg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ:-Africa/Nairobi}
    ports:
      - '51820:51820/udp'
    volumes:
      - ./infra/wireguard:/config
      - /lib/modules:/lib/modules:ro
      # Keeps wg0 actually in sync with wg_confs/wg0.conf after boot — see
      # the script's own comment for why this exists at all. A separate
      # directory from infra/wireguard itself: that one is gitignored
      # (it holds live keys and rendered configs), and this script is code.
      - ./infra/wireguard-init:/custom-cont-init.d:ro

volumes:
  billing-pgdata:
  ovpn-run:           # openvpn status file, shared read-only with the API
  billing-ovpn-pki:   # the tunnel CA; losing it means re-onboarding every router
  caddy-data:
  caddy-config:
