# Local stack: Postgres, FreeRADIUS, WireGuard.
#
#   docker compose up -d db                 # database only (what you had before)
#   docker compose --profile network up -d  # add FreeRADIUS + WireGuard
#
# The network services are behind a profile because they need host networking and
# elevated capabilities, and you do not want them running while you are only
# poking at the UI.
services:
  db:
    image: postgres:16-alpine
    container_name: billing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: billing
    ports:
      - '5432:5432'
    volumes:
      - billing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billing -d billing']
      interval: 5s
      timeout: 5s
      retries: 10

  # Authenticates PPPoE and hotspot users against the radcheck/radreply rows the
  # billing app writes. Reads its NAS list from the `nas` view over routers, so a
  # router added in the UI is authorised immediately.
  freeradius:
    image: freeradius/freeradius-server:3.2.5-alpine
    container_name: billing-radius
    profiles: ['network']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: billing
      PGPASSWORD: secret
      PGDATABASE: billing
    ports:
      - '1812:1812/udp'   # authentication
      - '1813:1813/udp'   # accounting
    volumes:
      - ./infra/freeradius/mods-available/sql:/etc/raddb/mods-available/sql:ro
      - ./infra/freeradius/sites-available/billing:/etc/raddb/sites-available/billing:ro
      - ./infra/freeradius/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    # -X is single-process debug mode: every decision is printed, which is what
    # you want while bringing this up. Drop to `radiusd -f` once it works.
    command: ['radiusd', '-X']

  # Management tunnel for RouterOS 6, which has no WireGuard. Routers authenticate
  # with the credentials the app minted into ovpn_clients — no per-router
  # certificates to issue by hand — and each is pinned to its allocated address.
  openvpn:
    build: ./infra/openvpn
    container_name: billing-ovpn
    profiles: ['network']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: billing
      PGPASSWORD: secret
      PGDATABASE: billing
    ports:
      - '1194:1194/tcp'   # TCP, not UDP: the RouterOS 6 client cannot do UDP
    volumes:
      - billing-ovpn-pki:/etc/openvpn/pki

  # Management tunnel for RouterOS 7. Each MikroTik gets a stable address in its
  # tenant's /24 so the server can reach it for CoA even behind CGNAT.
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: billing-wg
    profiles: ['network']
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Africa/Nairobi
    ports:
      - '51820:51820/udp'
    volumes:
      - ./infra/wireguard:/config
      - /lib/modules:/lib/modules:ro

volumes:
  billing-pgdata:
  billing-ovpn-pki:   # generated on first run; keep it or every router must re-trust the CA
