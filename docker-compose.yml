# Local stack: Postgres, FreeRADIUS, WireGuard.
#
#   docker compose up -d db                 # database only (what you had before)
#   docker compose --profile network up -d  # add FreeRADIUS + WireGuard
#
# The network services are behind a profile because they need host networking and
# elevated capabilities, and you do not want them running while you are only
# poking at the UI.
services:
  db:
    image: postgres:16-alpine
    container_name: billing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: billing
    ports:
      - '5432:5432'
    volumes:
      - billing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billing -d billing']
      interval: 5s
      timeout: 5s
      retries: 10

  # Authenticates PPPoE and hotspot users against the radcheck/radreply rows the
  # billing app writes. Its NAS list comes from the `nas` view over routers — but
  # read_clients loads that ONCE, at startup. A router added afterwards is unknown
  # and its packets are dropped without a reply, which looks exactly like the
  # server being down. Restart this service after onboarding a router.
  freeradius:
    build: ./infra/freeradius   # stock image + libpq, which it links against but omits
    container_name: billing-radius
    profiles: ['network']
    restart: unless-stopped
    # Shares the OpenVPN container's namespace, the only place the tunnel exists.
    # Routers send RADIUS to 10.50.0.1, the tunnel-side address of that namespace;
    # from a container of its own those packets reach the OpenVPN process instead.
    # Ports are published on the openvpn service.
    network_mode: 'service:openvpn'
    depends_on:
      db:
        condition: service_healthy
      openvpn:
        condition: service_started
    environment:
      TZ: Africa/Nairobi
      PGHOST: db
      PGPORT: '5432'
      PGUSER: billing
      PGPASSWORD: secret
      PGDATABASE: billing
    volumes:
      # Staged, not mounted into the config tree directly. Two reasons: this image
      # is built with --prefix=/opt so the tree is /opt/etc/raddb, and a bind mount
      # from Windows arrives world-writable, which FreeRADIUS refuses to load.
      # The entrypoint copies these in and fixes the mode.
      - ./infra/freeradius:/config:ro
    entrypoint: ['/bin/sh', '/config/entrypoint.sh']
    # -X is single-process debug mode: every decision is printed, which is what
    # you want while bringing this up. Drop to `radiusd -f` once it works.
    command: ['radiusd', '-X']

  # Management tunnel for RouterOS 6, which has no WireGuard. Routers authenticate
  # with the credentials the app minted into ovpn_clients — no per-router
  # certificates to issue by hand — and each is pinned to its allocated address.
  openvpn:
    build: ./infra/openvpn
    container_name: billing-ovpn
    profiles: ['network']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      TZ: Africa/Nairobi
      PGHOST: db
      PGPORT: '5432'
      PGUSER: billing
      PGPASSWORD: secret
      PGDATABASE: billing
    # Ports moved to docker-compose.prod.yml — see that file's comment on
    # this service. Compose concatenates `ports:` sequences across -f files
    # rather than letting a later file clear an earlier one (an empty
    # `ports: []` override there does nothing), so this key cannot coexist
    # here at all once the prod override adds `network_mode: service:net`.
    # No standalone/base-only deployment of this service actually runs in
    # practice — prod.yml is always combined with this file — so nothing
    # depends on these ports being reachable from the base file alone.
    volumes:
      - billing-ovpn-pki:/etc/openvpn/pki
      # Status file, so the API can see which routers are actually connected.
      - ovpn-run:/run/openvpn

  # Management tunnel for RouterOS 7. Each MikroTik gets a stable address in its
  # tenant's /24 so the server can reach it for CoA even behind CGNAT.
  wireguard:
    image: linuxserver/wireguard:latest
    container_name: billing-wg
    profiles: ['network']
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Africa/Nairobi
    # Port moved to docker-compose.prod.yml / `net` — see openvpn's comment
    # above for why this cannot coexist with the prod override's
    # network_mode: service:net.
    volumes:
      - ./infra/wireguard:/config
      - /lib/modules:/lib/modules:ro

volumes:
  billing-pgdata:
  ovpn-run:           # openvpn status file
  billing-ovpn-pki:   # generated on first run; keep it or every router must re-trust the CA
